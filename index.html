<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vibezy — share your vibe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f1fb; --card:#ffffff; --text:#1b1733; --muted:#6c6890; --line:#e7e4f4;
  --hover:#f1eefc; --input:#efecfa; --brand:#7c3aed; --brand-2:#ff4d8d; --sun:#ffb703;
  --danger:#e11d48; --ok:#16a34a; --shadow:0 1px 2px rgba(40,20,90,.06),0 8px 24px -12px rgba(40,20,90,.18);
  --grad:linear-gradient(135deg,#7c3aed 0%,#ff4d8d 62%,#ffb703 100%);
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d0b1c; --card:#171430; --text:#eeebff; --muted:#a29fc6; --line:#2a2650;
    --hover:#211d44; --input:#211d44; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0d0b1c; --card:#171430; --text:#eeebff; --muted:#a29fc6; --line:#2a2650;
  --hover:#211d44; --input:#211d44; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -12px rgba(0,0,0,.6);
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;transition:background .25s,color .25s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
.ic{flex:none;display:block}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em}

/* ---------- avatar ---------- */
.av{width:var(--s,40px);height:var(--s,40px);border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:calc(var(--s,40px)*.38);background-size:cover;background-position:center;position:relative;user-select:none}
.av.ring{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--brand-2)}
.dot{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:var(--ok);border:2px solid var(--card)}

/* ---------- auth ---------- */
#auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;background:var(--bg)}
.hero{position:relative;overflow:hidden;background:#17103a;color:#fff;padding:56px 56px 40px;display:flex;flex-direction:column;justify-content:space-between}
.hero::before{content:"";position:absolute;inset:-20%;background:radial-gradient(circle at 20% 15%,#7c3aed 0,transparent 45%),radial-gradient(circle at 85% 30%,#ff4d8d 0,transparent 42%),radial-gradient(circle at 40% 95%,#ffb703 0,transparent 40%);opacity:.85;filter:blur(30px);animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(3%,4%,0) scale(1.08)}}
.hero>*{position:relative}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.03em}
.logo i{width:34px;height:34px;border-radius:11px 11px 11px 4px;background:var(--grad);display:grid;place-items:center;font-style:normal;color:#fff;font-size:19px;box-shadow:0 6px 16px -6px rgba(255,77,141,.7)}
.hero h1{font-size:clamp(38px,5vw,64px);line-height:1.02;font-weight:800;max-width:11ch;margin:0 0 16px}
.hero p{max-width:38ch;font-size:17px;opacity:.9;margin:0}
.bubbles{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.bubbles span{background:rgba(255,255,255,.14);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.25);padding:8px 14px;border-radius:999px;font-weight:600;font-size:14px;animation:bob 4s ease-in-out infinite}
.bubbles span:nth-child(2n){animation-delay:-1.4s}.bubbles span:nth-child(3n){animation-delay:-2.6s}
@keyframes bob{50%{transform:translateY(-6px)}}
.auth-side{display:grid;place-items:center;padding:32px 20px}
.auth-card{width:min(420px,100%);background:var(--card);border-radius:28px 28px 28px 8px;padding:30px;box-shadow:var(--shadow)}
.tabs2{display:grid;grid-template-columns:1fr 1fr;background:var(--input);border-radius:14px;padding:4px;margin-bottom:20px}
.tabs2 button{padding:10px;border-radius:11px;font-weight:700;color:var(--muted)}
.tabs2 button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.fld{display:block;margin-bottom:14px}
.fld span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.fld input,.fld textarea,.fld select{width:100%;padding:12px 14px;background:var(--input);border:2px solid transparent;border-radius:12px;outline:0;transition:border-color .15s}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--brand)}
.err{color:var(--danger);font-size:13px;min-height:18px;margin:-4px 0 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;font-weight:700;background:var(--input);transition:transform .12s,filter .15s,background .15s}
.btn:hover{background:var(--hover);filter:brightness(.97)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--grad);color:#fff;box-shadow:0 8px 18px -8px rgba(255,77,141,.8)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.block{width:100%}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.dng{color:var(--danger)}
.btn:disabled{opacity:.5;pointer-events:none}
.or{text-align:center;color:var(--muted);font-size:13px;margin:14px 0}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);height:60px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 16px;gap:12px}
.top .logo{font-size:23px;color:var(--text)}
.top .logo i{width:30px;height:30px;font-size:16px}
.searchbox{position:relative;margin-left:14px;max-width:260px;flex:1}
.top-l{display:flex;align-items:center}
.searchbox input{width:100%;background:var(--input);border:0;outline:0;border-radius:999px;padding:9px 14px 9px 38px}
.searchbox .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.tabnav{display:flex;gap:4px}
.tabnav button,.iconbtn{position:relative;width:60px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--muted);transition:background .15s,color .15s}
.tabnav button:hover,.iconbtn:hover{background:var(--hover)}
.tabnav button.on{color:var(--brand)}
.tabnav button.on::after{content:"";position:absolute;bottom:-8px;left:20%;right:20%;height:3px;border-radius:3px;background:var(--grad)}
.top-r{display:flex;justify-content:flex-end;align-items:center;gap:6px}
.iconbtn{width:42px;height:42px;border-radius:50%;background:var(--input)}
.badge{position:absolute;top:2px;right:2px;min-width:18px;height:18px;border-radius:9px;background:var(--brand-2);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid var(--card)}
.panel{position:fixed;top:calc(env(safe-area-inset-top,0px) + 64px);right:14px;width:min(380px,calc(100vw - 28px));max-height:calc(100vh - 100px);overflow:auto;background:var(--card);border-radius:20px;box-shadow:0 20px 50px -12px rgba(30,10,80,.35);border:1px solid var(--line);z-index:60;padding:10px;animation:pop .16s ease-out}
.panel.left{right:auto;left:14px}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.98)}}
.panel h3{font-size:20px;padding:6px 8px 10px;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:14px;width:100%;text-align:left;transition:background .12s}
.row:hover{background:var(--hover)}
.row.unread{background:color-mix(in srgb,var(--brand) 9%,transparent)}
.row .grow{flex:1;min-width:0}
.row small,.muted{color:var(--muted)}
.row b{font-weight:700}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty .big{font-size:38px;margin-bottom:6px}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:270px minmax(0,640px) 300px;gap:20px;justify-content:center;padding:18px 16px 40px;max-width:1280px;margin:0 auto}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 78px);align-self:start;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 90px);overflow:auto;scrollbar-width:thin}
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:16px}
.card.tight{padding:8px}
.card h3{font-size:17px;margin:2px 6px 8px}
.nav-i{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;width:100%;font-weight:600;transition:background .12s}
.nav-i:hover{background:var(--hover)}
.nav-i.on{background:var(--hover);color:var(--brand)}
.nav-i .tile{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--input);color:var(--brand)}
.tag{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:12px}
.tag:hover{background:var(--hover)}
.tag b{color:var(--brand)}
.tag small{display:block;color:var(--muted)}

/* ---------- composer / stories ---------- */
.composer{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.composer .fake{flex:1;text-align:left;background:var(--input);padding:12px 16px;border-radius:999px;color:var(--muted)}
.composer .fake:hover{background:var(--hover)}
.cactions{display:flex;gap:6px}
.stories{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 12px;margin-bottom:6px;scrollbar-width:none;scroll-snap-type:x proximity}
.stories::-webkit-scrollbar{display:none}
.story{flex:none;width:112px;height:184px;border-radius:18px;position:relative;overflow:hidden;color:#fff;text-align:left;scroll-snap-align:start;background-size:cover;background-position:center;transition:transform .18s}
.story:hover{transform:translateY(-3px)}
.story::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),transparent 35%,rgba(0,0,0,.6))}
.story .av{position:absolute;left:8px;top:8px;--s:38px;z-index:2;box-shadow:0 0 0 3px var(--brand-2)}
.story .st-name{position:absolute;left:8px;right:8px;bottom:8px;z-index:2;font-weight:700;font-size:13px;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.story .st-txt{position:absolute;z-index:1;inset:52px 10px 40px;display:grid;place-items:center;text-align:center;font-family:var(--display);font-weight:800;font-size:15px;line-height:1.1;overflow:hidden}
.story.add{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.story.add::after{display:none}
.story.add .top-img{height:68%;background-size:cover;background-position:center;display:grid;place-items:center;font-size:40px;font-weight:700;color:#fff}
.story.add .plus{position:absolute;left:50%;top:68%;transform:translate(-50%,-50%);width:36px;height:36px;border-radius:50%;background:var(--grad);display:grid;place-items:center;border:3px solid var(--card);color:#fff}
.story.add .st-name{color:var(--text);text-shadow:none;text-align:center;bottom:10px}

.pills{display:flex;gap:8px;margin:4px 0 12px;flex-wrap:wrap;align-items:center}
.pill{padding:8px 15px;border-radius:999px;background:var(--card);font-weight:700;color:var(--muted);box-shadow:var(--shadow)}
.pill.on{background:var(--text);color:var(--bg)}
.chip-x{display:inline-flex;gap:6px;align-items:center;background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--brand);padding:6px 10px;border-radius:999px;font-weight:700}

/* ---------- post ---------- */
.post{background:var(--card);border-radius:22px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;animation:rise .35s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.post-h{display:flex;gap:12px;padding:14px 16px 6px;align-items:center}
.post-h .who{flex:1;min-width:0}
.post-h .who b{cursor:pointer}
.post-h .who b:hover{text-decoration:underline}
.post-h small{color:var(--muted)}
.post-t{padding:6px 16px 10px;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.post-t.big{font-family:var(--display);font-size:24px;font-weight:800;line-height:1.15;padding:20px 16px}
.hashtag{color:var(--brand);font-weight:700;cursor:pointer}
.hashtag:hover{text-decoration:underline}
.post-img{width:100%;max-height:560px;object-fit:cover;display:block;background:var(--input);cursor:zoom-in}
.shared{margin:0 16px 12px;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.shared .post-h{padding-top:12px}
.counts{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;color:var(--muted);font-size:14px}
.counts .rx{display:flex;align-items:center;gap:6px}
.rx-stack{display:flex}
.rx-stack span{width:20px;height:20px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:13px;margin-left:-5px;box-shadow:0 0 0 2px var(--card)}
.rx-stack span:first-child{margin-left:0}
.counts button:hover{text-decoration:underline}
.acts{display:flex;border-top:1px solid var(--line);margin:0 10px;padding:4px 0}
.acts>div,.acts>button{flex:1;position:relative}
.act{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;border-radius:12px;font-weight:700;color:var(--muted);transition:background .12s,color .12s}
.act:hover{background:var(--hover)}
.act.on{color:var(--c,var(--brand))}
.act .emo{font-size:19px;transition:transform .2s}
.act:active .emo{transform:scale(1.4)}
.picker{position:absolute;bottom:100%;left:0;background:var(--card);border-radius:999px;box-shadow:0 12px 30px -8px rgba(30,10,80,.4);border:1px solid var(--line);padding:6px 8px;display:flex;gap:2px;opacity:0;transform:translateY(8px) scale(.9);transform-origin:bottom left;pointer-events:none;transition:.16s;z-index:5}
.react-wrap:hover .picker,.react-wrap.show .picker{opacity:1;transform:none;pointer-events:auto}
.picker button{font-size:28px;width:44px;height:44px;border-radius:50%;transition:transform .15s}
.picker button:hover{transform:translateY(-8px) scale(1.3)}
.cm-wrap{padding:6px 16px 14px;border-top:1px solid var(--line)}
.cm{display:flex;gap:10px;margin-top:10px}
.cm .grow{flex:1;min-width:0}
.bubble{display:inline-block;background:var(--input);padding:8px 13px;border-radius:6px 18px 18px 18px;max-width:100%}
.bubble b{display:block;font-size:13px;cursor:pointer}
.bubble p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.cm-meta{display:flex;gap:12px;font-size:12.5px;color:var(--muted);padding:2px 8px;font-weight:600;align-items:center}
.cm-meta button:hover{text-decoration:underline}
.cm-meta .lk{color:var(--brand-2)}
.replies{margin-left:8px;border-left:2px solid var(--line);padding-left:10px}
.cinput{display:flex;gap:10px;align-items:center;margin-top:12px}
.cinput input{flex:1;background:var(--input);border:0;outline:0;border-radius:999px;padding:10px 16px;min-width:0}
.cinput button{color:var(--brand);width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.cinput button:hover{background:var(--hover)}
.menu-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.menu-btn:hover{background:var(--hover)}

/* ---------- skeleton ---------- */
.sk{background:linear-gradient(90deg,var(--input) 25%,var(--hover) 50%,var(--input) 75%);background-size:200% 100%;animation:sh 1.2s linear infinite;border-radius:10px}
@keyframes sh{to{background-position:-200% 0}}

/* ---------- profile ---------- */
.cover{height:240px;border-radius:22px 22px 0 0;background-size:cover;background-position:center;position:relative}
.prof-head{background:var(--card);border-radius:0 0 22px 22px;box-shadow:var(--shadow);padding:0 22px 16px;margin-bottom:14px}
.prof-top{display:flex;gap:18px;align-items:flex-end;margin-top:-56px;flex-wrap:wrap}
.prof-top .av{--s:132px;border:5px solid var(--card);font-size:48px}
.prof-top .info{flex:1;min-width:180px;padding-bottom:6px}
.prof-top h2{font-size:30px;font-weight:800}
.prof-actions{display:flex;gap:8px;padding-bottom:10px;flex-wrap:wrap}
.meta-row{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);margin-top:10px;font-weight:500}
.meta-row span{display:flex;gap:6px;align-items:center}
.ptabs{display:flex;gap:6px;margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.ptabs button{padding:9px 16px;border-radius:12px;font-weight:700;color:var(--muted)}
.ptabs button.on{background:var(--hover);color:var(--brand)}
.grid-f{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.fcard{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:18px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.fcard .av{--s:72px}
.fcard b{cursor:pointer}
.fcard .btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.sec-t{font-family:var(--display);font-size:20px;font-weight:800;margin:6px 4px 12px}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(14,8,40,.6);backdrop-filter:blur(4px);z-index:80;display:grid;place-items:center;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{width:min(540px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--card);border-radius:26px;box-shadow:0 30px 70px -20px rgba(0,0,0,.6);animation:pop .2s ease-out}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:2}
.modal-h h3{font-size:20px}
.modal-b{padding:16px 18px 18px}
.x{width:36px;height:36px;border-radius:50%;background:var(--input);display:grid;place-items:center}
.x:hover{background:var(--hover)}
.compose-ta{width:100%;border:0;outline:0;background:transparent;resize:none;min-height:110px;font-size:19px;padding:6px 0}
.preview{position:relative;margin:8px 0}
.preview img{width:100%;max-height:300px;object-fit:cover;border-radius:14px;display:block}
.preview .x{position:absolute;right:8px;top:8px;background:rgba(0,0,0,.6);color:#fff}
.addbar{display:flex;gap:8px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:14px;padding:8px 10px;margin:10px 0 14px;flex-wrap:wrap}
.addbar .btn{background:transparent}
.addbar select{background:var(--input);border:0;border-radius:10px;padding:8px;outline:0}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.sw button{width:34px;height:34px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.sw button.on{box-shadow:0 0 0 3px var(--brand)}
.st-prev{height:300px;border-radius:18px;display:grid;place-items:center;text-align:center;padding:22px;color:#fff;font-family:var(--display);font-weight:800;font-size:28px;line-height:1.1;background-size:cover;background-position:center;overflow:hidden}
.st-prev textarea{width:100%;height:100%;background:transparent;border:0;outline:0;resize:none;color:#fff;font:inherit;text-align:center;display:block}
.st-prev textarea::placeholder{color:rgba(255,255,255,.7)}

/* ---------- story viewer ---------- */
.viewer{position:fixed;inset:0;z-index:90;background:#0a0716;display:grid;place-items:center}
.vbox{position:relative;width:min(420px,100vw);height:min(760px,100vh);border-radius:22px;overflow:hidden;color:#fff;background-size:cover;background-position:center;display:grid;place-items:center;text-align:center;padding:90px 28px;font-family:var(--display);font-weight:800;font-size:32px;line-height:1.1;user-select:none;-webkit-user-select:none}
.vbox .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45),transparent 25%,transparent 70%,rgba(0,0,0,.5));pointer-events:none}
.vbars{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:4px;z-index:3}
.vbars i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.35);overflow:hidden}
.vbars i b{display:block;height:100%;width:0;background:#fff}

const MIN = 60e3, HOUR = 36e5, DAY = 864e5;
function ago(t) {
  const d = now() - t;
  if (d < MIN) return "Just now";
  if (d < HOUR) return Math.floor(d / MIN) + "m";
  if (d < DAY) return Math.floor(d / HOUR) + "h";
  if (d < 7 * DAY) return Math.floor(d / DAY) + "d";

  return "data:image/svg+xml;utf8," + encodeURIComponent(svg);

function readImage(file, max = 960) {
  return new Promise((res, rej) => {
    if (!file || !file.type.startsWith("image/")) return rej(new Error("Please choose an image file."));
    const fr = new FileReader();
    fr.onerror = () => rej(new Error("Could not read that file."));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error("That image could not be opened."));
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", 0.78));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function pickImage(max) {
  return new Promise((res, rej) => {
    const i = document.createElement("input");
    i.type = "file"; i.accept = "image/*";
    i.onchange = () => i.files[0] ? readImage(i.files[0], max).then(res, rej) : rej(new Error("No file"));
    i.click();
  });
}
async function sha(pw, salt) {
  try {
    const b = new TextEncoder().encode(salt + ":" + pw);
    const d = await crypto.subtle.digest("SHA-256", b);
    return [...new Uint8Array(d)].map(x => x.toString(16).padStart(2, "0")).join("");
  } catch (e) { return btoa(salt + pw); }
}

document.addEventListener("submit", async e => {
  const f = e.target; if (f.id !== "f-login" && f.id !== "f-signup") return;
  e.preventDefault();
  const fd = Object.fromEntries(new FormData(f));
  const err = m => { $("#auth-err").textContent = m; };
  const email = (fd.email || "").trim().toLowerCase();
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return err("Enter a valid email address.");
  if ((fd.pw || "").length < 6) return err("Password needs at least 6 characters.");
  if (f.id === "f-signup") {
    const name = (fd.name || "").trim().replace(/\s+/g, " ");
    if (name.length < 2) return err("Enter your full name.");
    if (db.users.some(u => u.email === email)) return err("That email already has an account. Try logging in.");
    const id = "me" + uid();
    const salt = uid();
    const handle = name.toLowerCase().replace(/[^a-z0-9]+/g, "") || "user";
    db.users.push({ id, name, handle, email, salt, hash: await sha(fd.pw, salt), city: "", bio: "New to Vibezy ✨", g: Math.floor(Math.random() * GRADS.length), cover: null, img: null, joined: now() });

    db.session = id; save(); boot(); toast("Welcome to Vibezy, " + name.split(" ")[0] + "!");
  } else {
    const u = db.users.find(x => x.email === email && x.hash);
    if (!u || (await sha(fd.pw, u.salt)) !== u.hash) return err("Email or password is incorrect.");
    db.session = u.id; save(); boot();
  }
});

/* ---------- post actions ---------- */
function react(id, k, toggle) {
  const p = postById(id); if (!p) return;
  p.reactions = p.reactions || {};
  if (toggle && p.reactions[db.session]) delete p.reactions[db.session];
  else {
    const first = !p.reactions[db.session];
    p.reactions[db.session] = k;
    if (first) notify(p.userId, `<b>${esc(me().name)}</b> reacted ${rx(k).e} to your post.`, rx(k).e);
  }
  save(); rerenderPost(id); renderTop(); renderBottom();
}
function addComment(id, text, parent) {
  text = text.trim(); if (!text) return;
  const p = postById(id); if (!p) return;
  const c = { id: uid(), userId: db.session, text, time: now(), likes: [], replies: [] };
  if (parent) {
    const pc = p.comments.find(x => x.id === parent); if (!pc) return;
    pc.replies.push({ id: c.id, userId: c.userId, text, time: c.time, likes: [] });
    notify(pc.userId, `<b>${esc(me().name)}</b> replied to your comment.`, "💬");
  } else {
    p.comments.push(c);
    notify(p.userId, `<b>${esc(me().name)}</b> commented on your post: “${esc(text.slice(0, 40))}”`, "💬");
  }
  S.openCm.add(id); save(); rerenderPost(id);
  const inp = $(`[data-post="${id}"] .ci`); inp && inp.focus();
  renderTop(); renderBottom();
  // lively demo: seeded friends sometimes answer
  if (!parent && p.userId === db.session && Math.random() < .8) {
    const cand = myFriends().filter(f => f.seed);
    if (cand.length) setTimeout(() => {
      const f = cand[Math.floor(Math.random() * cand.length)];
      const lines = ["Love this! 🔥", "Haha so true 😄", "This made my day!", "Great vibe ✨", "Yesss, more of this please", "Looking good 👏"];
      if (!postById(id)) return;
      postById(id).comments.push({ id: uid(), userId: f.id, text: lines[Math.floor(Math.random() * lines.length)], time: now(), likes: [], replies: [] });
      db.notifs.unshift({ id: uid(), to: db.session, text: `<b>${esc(f.name)}</b> commented on your post.`, icon: "💬", time: now(), read: false, link: null });
      save(); rerenderPost(id); renderTop(); renderBottom(); toast(f.name.split(" ")[0] + " commented on your post");
    }, 2200);
  }
}

  const box = $("#msgs"); if (!box) return;
  const list = db.chats[chatKey(S.chatWith)] || [];
  box.innerHTML = (list.length ? "" : `<div class="empty">Say hi to ${esc(user(S.chatWith).name.split(" ")[0])} 👋</div>`) +
    list.map(m => `<div class="msg ${m.from === db.session ? "me" : "them"}">${esc(m.text)}</div>`).join("") + (typing ? `<div class="msg them typing"><i></i><i></i><i></i></div>` : "");
  box.scrollTop = box.scrollHeight;
}
function sendMsg() {
  const inp = $("#chat-in"); const text = inp.value.trim(); if (!text) return;
  const id = S.chatWith, k = chatKey(id);
  (db.chats[k] = db.chats[k] || []).push({ from: db.session, text, time: now() });
  inp.value = ""; save(); paintMsgs(true);
  const u = user(id);
  if (u.seed) setTimeout(() => {
    (db.chats[k] = db.chats[k] || []).push({ from: id, text: REPLIES[Math.floor(Math.random() * REPLIES.length)], time: now() });
    save(); if (S.chatWith === id) paintMsgs();
  }, 1100 + Math.random() * 900);
  else paintMsgs();
}

/* =====================================================================
   STORIES: create + view
   ===================================================================== */
function newStory() {
  let img = null, bg = 0;
  modal("Create story", `
    <div class="st-prev" id="sp" style="background-image:${GRADS[0]}"><textarea id="s-text" maxlength="90" placeholder="Start typing…" aria-label="Story text"></textarea></div>
    <div class="sw" id="s-sw">${GRADS.map((g, i) => `<button data-bg="${i}" class="${i === 0 ? "on" : ""}" style="background:${g}" aria-label="Background ${i + 1}"></button>`).join("")}</div>
    <div style="display:flex;gap:8px"><button class="btn" id="s-img">${ic("image", 18)} Use a photo</button><button class="btn pri" id="s-go" style="flex:1">Share to story</button></div>`, () => {
    const sp = $("#sp");
    const paint = () => { sp.style.backgroundImage = img ? `url('${img}')` : GRADS[bg]; };
    $("#s-sw").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; $$("#s-sw button").forEach(x => x.classList.remove("on")); b.classList.add("on"); bg = Number(b.dataset.bg); img = null; paint(); });
    $("#s-img").onclick = async () => { try { img = await pickImage(720); paint(); } catch (e) { if (e.message !== "No file") toast(e.message); } };
    $("#s-go").onclick = () => {
      const text = $("#s-text").value.trim();
      if (!text && !img) return toast("Add some text or a photo first.");
      db.stories.push({ id: uid(), userId: db.session, text, bg, img, time: now(), seen: [] });
      save(); closeModal(); renderCenter(); toast("Story shared — it disappears in 24 hours.");
    };
  });
}
let viewer = null;
function viewStory(uidv) {
  const groups = storyGroups();
  const gi = groups.findIndex(g => g.u === uidv);
  if (gi < 0) return;
  viewer = { groups, gi, si: 0, t0: now(), paused: false, elapsed: 0, DUR: 5000, timer: null };
  drawViewer(); viewer.timer = setInterval(tick, 40);
}
function tick() {
  if (!viewer || viewer.paused) { if (viewer) viewer.t0 = now() - viewer.elapsed; return; }
  viewer.elapsed = now() - viewer.t0;
  const bar = $(`.vbars i:nth-child(${viewer.si + 1}) b`); if (bar) bar.style.width = Math.min(100, viewer.elapsed / viewer.DUR * 100) + "%";
  if (viewer.elapsed >= viewer.DUR) nextStory();
}
function drawViewer() {
  const g = viewer.groups[viewer.gi]; const s = g.list[viewer.si]; const u = user(g.u);
  viewer.t0 = now(); viewer.elapsed = 0;
  if (!(s.seen || (s.seen = [])).includes(db.session)) { s.seen.push(db.session); save(); }
  let root = $("#viewer"); if (!root) { root = document.createElement("div"); root.id = "viewer"; root.className = "viewer"; document.body.appendChild(root); }
  root.innerHTML = `
    <button class="vbtn l" data-act="prevStory" aria-label="Previous">${ic("back", 24)}</button><button class="vbtn r" data-act="nextStory" aria-label="Next">${ic("next", 24)}</button>
    <div class="vbox" style="${storyBg(s)}"><div class="shade"></div>
      <div class="vbars">${g.list.map((_, i) => `<i><b style="width:${i < viewer.si ? 100 : 0}%"></b></i>`).join("")}</div>
      <div class="vhead">${av(u, 38)}<div><div>${esc(u.name)}</div><small>${ago(s.time)}</small></div>${g.u === db.session ? `<button class="x" data-act="delStory" data-id="${s.id}" aria-label="Delete story" style="margin-left:auto;margin-right:6px">${ic("trash", 18)}</button><button class="x" data-act="closeViewer" aria-label="Close" style="margin-left:0">${ic("x")}</button>` : `<button class="x" data-act="closeViewer" aria-label="Close">${ic("x")}</button>`}</div>
      <div class="vnav l" data-act="prevStory"></div><div class="vnav r" data-act="nextStory"></div>
      ${s.img ? "" : `<span style="position:relative;z-index:1">${esc(s.text)}</span>`}
      ${s.img && s.text ? `<span style="position:absolute;bottom:90px;left:20px;right:20px;font-size:22px;text-shadow:0 2px 8px rgba(0,0,0,.7)">${esc(s.text)}</span>` : ""}
      ${g.u !== db.session ? `<div class="vfoot"><input id="v-in" placeholder="Reply to ${esc(u.name.split(" ")[0])}…" maxlength="200" aria-label="Reply to story"><button data-act="storyHeart" aria-label="Send heart">❤️</button></div>` : `<div class="vfoot" style="justify-content:center;opacity:.85"><span style="font-size:14px">👁 ${(s.seen || []).filter(x => x !== db.session).length} view${(s.seen || []).filter(x => x !== db.session).length === 1 ? "" : "s"}</span></div>`}
    </div>`;
  const vb = $(".vbox", root);
  const hold = v => { viewer && (viewer.paused = v); };
  vb.addEventListener("pointerdown", e => { if (!e.target.closest("input,button")) hold(true); });
  ["pointerup", "pointerleave", "pointercancel"].forEach(ev => vb.addEventListener(ev, () => hold(false)));
  const inp = $("#v-in", root); if (inp) { inp.addEventListener("focus", () => hold(true)); inp.addEventListener("blur", () => hold(false)); inp.addEventListener("keydown", e => { if (e.key === "Enter" && inp.value.trim()) { storyReply(inp.value.trim()); inp.value = ""; } }); }
}
function storyReply(text) {
  const g = viewer.groups[viewer.gi];
  const k = [db.session, g.u].sort().join("|");
  (db.chats[k] = db.chats[k] || []).push({ from: db.session, text: "Replied to your story: " + text, time: now() });
  save(); toast("Reply sent to " + user(g.u).name.split(" ")[0]);
}
function nextStory() {
  const g = viewer.groups[viewer.gi];
  if (viewer.si < g.list.length - 1) { viewer.si++; drawViewer(); }
  else if (viewer.gi < viewer.groups.length - 1) { viewer.gi++; viewer.si = 0; drawViewer(); }
  else closeViewer();
}
function prevStory() {
  if (viewer.si > 0) { viewer.si--; drawViewer(); }
  else if (viewer.gi > 0) { viewer.gi--; viewer.si = viewer.groups[viewer.gi].list.length - 1; drawViewer(); }
  else drawViewer();
}
function closeViewer() { if (!viewer) return; clearInterval(viewer.timer); viewer = null; const r = $("#viewer"); r && r.remove(); renderCenter(); }

/* ---------- lightbox ---------- */
function openLightbox(src) { const d = document.createElement("div"); d.className = "lightbox"; d.id = "lb"; d.innerHTML = `<img src="${src}" alt="Full size photo">`; d.onclick = closeLightbox; document.body.appendChild(d); }
function closeLightbox() { const d = $("#lb"); d && d.remove(); }

/* =====================================================================
   GLOBAL EVENT DELEGATION
   ===================================================================== */
const A = {
  nav: t => { if (t.dataset.clear) { search.value = ""; } go(t.dataset.view, t.dataset.id || null); },
  authTab: t => { authTab = t.dataset.tab; renderAuth(); },
  demo: () => demoLogin(),
  theme: () => { db.settings.theme = isDark() ? "light" : "dark"; save(); applyTheme(); renderTop(); renderLeft(); if (S.panel === "menu") openPanel("menu"); },
  panel: t => { if (t.dataset.p === "notif" || t.dataset.p === "chat" || t.dataset.p === "menu") openPanel(t.dataset.p); },
  readAll: () => { db.notifs.forEach(n => { if (n.to === db.session) n.read = true; }); save(); S.panel = null; openPanel("notif"); renderTop(); renderBottom(); },
  notifGo: t => {
    const n = db.notifs.find(x => x.id === t.dataset.id); if (!n) return; n.read = true; save(); closePanel(); renderTop(); renderBottom();
    if (n.link === "friends") go("friends");
  },
  logout: () => { closePanel(); closeChat(); db.session = null; save(); renderAuth(); },
  resetDemo: () => { if (confirm("Reset all Vibezy demo data in this browser? Accounts and posts will be erased.")) { try { localStorage.removeItem(KEY); } catch (e) {} memCopy = null; db = seed(); save(); closePanel(); closeChat(); renderAuth(); toast("Demo data reset"); } },
  composer: t => { closePanel(); openComposer(!!t.dataset.img); },
  closeModal: () => closeModal(),
  ovl: (t, e) => { if (e.target === t) closeModal(); },
  feedTab: t => { S.feedTab = t.dataset.t; S.limit = 5; renderCenter(); },
  more: () => { S.limit += 5; $("#posts").innerHTML = postsHTML(); },
  tag: t => { S.tag = t.dataset.tag || null; S.limit = 5; if (S.view !== "feed") { S.view = "feed"; renderAll(); } else renderCenter(); },
  react: (t, e) => { e.stopPropagation(); react(t.dataset.id, t.dataset.k, !!t.dataset.toggle); },
  toggleCm: t => { const id = t.dataset.id; S.openCm.has(id) ? S.openCm.delete(id) : S.openCm.add(id); rerenderPost(id); if (S.openCm.has(id)) { const i = $(`[data-post="${id}"] .ci`); i && i.focus(); } },
  sendCm: t => { const i = $(`[data-post="${t.dataset.id}"] .ci`); addComment(t.dataset.id, i.value); },
  likeCm: t => {
    const p = postById(t.dataset.p); if (!p) return;
    let c = null; p.comments.forEach(x => { if (x.id === t.dataset.id) c = x; x.replies.forEach(r => { if (r.id === t.dataset.id) c = r; }); });
    if (!c) return; c.likes = c.likes || [];
    const i = c.likes.indexOf(db.session);
    if (i >= 0) c.likes.splice(i, 1); else { c.likes.push(db.session); notify(c.userId, `<b>${esc(me().name)}</b> liked your comment.`, "❤️"); }
    save(); rerenderPost(p.id); renderTop(); renderBottom();
  },
  replyCm: t => {
    const box = $(`[data-rbox="${t.dataset.id}"]`); if (!box) return;
    if (box.innerHTML) { box.innerHTML = ""; return; }
    box.innerHTML = `<div class="cinput">${av(me(), 28)}<input class="ri" placeholder="Write a reply…" maxlength="500" aria-label="Write a reply"><button data-act="sendReply" data-p="${t.dataset.p}" data-id="${t.dataset.id}" aria-label="Send reply">${ic("send", 18)}</button></div>`;
    $(".ri", box).focus();
  },
  sendReply: t => { const i = $(".ri", t.closest(".rbox")); addComment(t.dataset.p, i.value, t.dataset.id); },
  delCm: t => {
    const p = postById(t.dataset.p); if (!p) return;
    p.comments = p.comments.filter(c => c.id !== t.dataset.id);
    p.comments.forEach(c => c.replies = c.replies.filter(r => r.id !== t.dataset.id));
    save(); rerenderPost(p.id); toast("Comment deleted");
  },
  share: t => openComposer(false, t.dataset.id),
  delPost: t => {
    if (!confirm("Delete this post? This can't be undone.")) return;
    db.posts = db.posts.filter(p => p.id !== t.dataset.id); db.posts.forEach(p => { if (p.shared === t.dataset.id) p.shared = t.dataset.id; });
    save(); const el = $(`[data-post="${t.dataset.id}"]`); el && el.remove(); renderLeft(); toast("Post deleted");
  },
  lightbox: t => openLightbox(t.src),
  addFriend: t => {
    const id = t.dataset.id; db.requests.push({ from: db.session, to: id }); save();
    const u = user(id); toast("Friend request sent to " + u.name.split(" ")[0]);
    if (u.seed) setTimeout(() => { // seeded people sometimes accept
      if (!db.session || reqState(db.session, id) !== "sent") return;
      db.requests = db.requests.filter(r => !(r.from === db.session && r.to === id)); befriend(db.session, id);
      db.notifs.unshift({ id: uid(), to: db.session, text: `<b>${esc(u.name)}</b> accepted your friend request.`, icon: "🤝", time: now(), read: false, link: null });
      save(); renderAll(); toast(u.name.split(" ")[0] + " accepted your request!");
    }, 3500);
    renderAll();
  },
  cancelReq: t => { db.requests = db.requests.filter(r => !(r.from === db.session && r.to === t.dataset.id)); refreshSocial(); },
  accept: t => { const id = t.dataset.id; db.requests = db.requests.filter(r => !(r.from === id && r.to === db.session)); befriend(db.session, id); refreshSocial(); toast("You and " + user(id).name.split(" ")[0] + " are now friends"); },
  decline: t => { db.requests = db.requests.filter(r => !(r.from === t.dataset.id && r.to === db.session)); refreshSocial(); },
  unfriend: t => { const id = t.dataset.id; if (!confirm("Remove " + user(id).name + " from your friends?")) return; db.friends[db.session] = db.friends[db.session].filter(x => x !== id); db.friends[id] = (db.friends[id] || []).filter(x => x !== db.session); refreshSocial(); },
  profTab: t => { S.profTab = t.dataset.t; renderCenter(); },
  editProfile: () => { closePanel(); editProfile(); },
  changeCover: async () => { try { const img = await pickImage(1200); me().cover = img; save(); renderCenter(); toast("Cover photo updated"); } catch (e) { if (e.message !== "No file") toast(e.message); } },
  openChat: t => openChat(t.dataset.id),
  closeChat: () => closeChat(),
  sendMsg: () => sendMsg(),
  newStory: () => newStory(),
  viewStory: t => viewStory(t.dataset.u),
  nextStory: () => viewer && nextStory(),
  prevStory: () => viewer && prevStory(),
  closeViewer: () => closeViewer(),
  storyHeart: () => { const g = viewer.groups[viewer.gi]; notify(g.u, "", ""); toast("❤️ Sent to " + user(g.u).name.split(" ")[0]); },
  delStory: t => { db.stories = db.stories.filter(s => s.id !== t.dataset.id); save(); closeViewer(); toast("Story deleted"); },
};
function closeChat() { S.chatWith = null; $("#chat-root").innerHTML = ""; }

document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const f = A[t.dataset.act]; if (f) f(t, e);
});
document.addEventListener("keydown", e => {
  if (e.key !== "Enter" || e.shiftKey) return;
  const t = e.target;
  if (t.classList && t.classList.contains("ci")) { e.preventDefault(); addComment(t.dataset.post, t.value); }
  else if (t.classList && t.classList.contains("ri")) { e.preventDefault(); const b = $("[data-act=sendReply]", t.closest(".rbox")); b && b.click(); }
  else if (t.id === "chat-in") { e.preventDefault(); sendMsg(); }
});
// touch: long-press Like to open the reaction picker
(function () {
  let timer = null, wrap = null;
  document.addEventListener("touchstart", e => {
    const w = e.target.closest(".react-wrap"); 
    $$(".react-wrap.show").forEach(x => { if (x !== w) x.classList.remove("show"); });
    if (!w || e.target.closest(".picker")) return;
    wrap = w; timer = setTimeout(() => { wrap.classList.add("show"); wrap.dataset.lp = "1"; }, 380);
  }, { passive: true });
  ["touchend", "touchmove", "touchcancel"].forEach(ev => document.addEventListener(ev, () => clearTimeout(timer), { passive: true }));
  document.addEventListener("click", e => {
    if (wrap && wrap.dataset.lp && e.target.closest(".act") && wrap.contains(e.target)) { e.stopPropagation(); e.preventDefault(); delete wrap.dataset.lp; return; }
    if (!e.target.closest(".react-wrap")) $$(".react-wrap.show").forEach(x => x.classList.remove("show"));
  }, true);
})();
matchMedia("(prefers-color-scheme: dark)").addEventListener && matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (db.session) { renderTop(); renderLeft(); } });

/* ---------- start ---------- */
boot();
</script>
</body>
</html>
